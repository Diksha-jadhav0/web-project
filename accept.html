<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yay! 💖 Digital Love Jar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="accept.css">
</head>
<body>
    <div class="container fade-in">
        <h2 class="sub-heading">Yay! You said Yes!</h2>
        <h1 class="main-heading">Your Digital Love Jar 💌</h1>
        <p class="instruction">Tap the jar to pick a love note...</p>

        <div class="love-jar-container">
            <div class="love-jar" onclick="pickLoveNote()">
                <img src="lovejar.png" alt="Love Jar" class="jar-img">
            </div>
        </div>

        <div id="note-container"></div>
        
        <div class="custom-note-section">
            <input type="text" id="newNote" placeholder="Write a love note of your own...">
            <button onclick="addLoveNote()">Add to Jar</button>
        </div>
    </div>

    <script src="accept.js"></script>
</body>
</html>
